
name: Songdo Reservation

on:
  repository_dispatch:
    types: [run-songdo-reservation]
  workflow_dispatch:  # ← 수동으로도 실행할 수 있게 추가

jobs:
  run-script:
    runs-on: self-hosted  # 로컬/개인 PC Runner

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        shell: cmd

      - name: Run Songdo Reservation Script
        run: python 1-songdo-naver-reservation.py
        shell: cmd
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_PW: ${{ secrets.NAVER_PW }}
          SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}
          PYTHONIOENCODING: utf-8
