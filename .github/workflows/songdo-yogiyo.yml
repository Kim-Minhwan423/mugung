name: Songdo Yogiyo

on:
  repository_dispatch:
    types: [run-songdo-yogiyo]  # 원하는 이벤트 타입
  workflow_dispatch:  # ← 수동으로도 실행할 수 있게 추가

jobs:
  run-script:
    runs-on: self-hosted  # 로컬/개인 PC Runner

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        shell: cmd

      - name: Run Yogiyo Auto Script
        run: python 1-songdo-yogiyo-auto.py
        shell: cmd
        env:
          SONGDO_YOGIYO_ID: ${{ secrets.SONGDO_YOGIYO_ID }}
          SONGDO_YOGIYO_PW: ${{ secrets.SONGDO_YOGIYO_PW }}
          SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}
          PYTHONIOENCODING: utf-8
